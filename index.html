<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title id="pageTitle"></title>
  <!-- MathJax 配置与加载 -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
  </script>
  <style>
    /* 彻底黑白背景，只有紫色字和紫色光标 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, 'Nouveau IBM', 'VT323', monospace;
      padding: 16px;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    }

    .terminal {
      max-width: 820px;
      width: 100%;
      background: #000000;
      padding: 24px 20px 28px;
    }

    .terminal, .terminal * {
      color: #9b59b6;
      font-weight: 400;
      letter-spacing: 0.3px;
      text-shadow: none;
    }

    /* MathJax SVG 输出的颜色覆盖为紫色 */
    .MathJax_SVG, .MathJax {
      color: #9b59b6 !important;
      fill: #9b59b6 !important;
    }
    .MathJax_SVG * {
      color: #9b59b6 !important;
      fill: #9b59b6 !important;
    }
    .MathJax_SVG g path, .MathJax_SVG g rect, .MathJax_SVG g use {
      stroke: #9b59b6 !important;
      fill: #9b59b6 !important;
    }
    .MathJax_SVG mtext, .MathJax_SVG mi, .MathJax_SVG mn, .MathJax_SVG mo {
      fill: #9b59b6 !important;
      color: #9b59b6 !important;
    }

    /* 红色字体专门用于 666 */
    .red-text {
      color: #ff0000 !important;
    }

    /* 去除网站标题区域 */
    .cmd-header {
      display: none;
    }

    .input-area {
      background: transparent;
      border: none;
      padding: 12px 0 16px 0;
      box-shadow: none;
      margin-bottom: 16px;
    }

    .prompt-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      font-size: 1.3rem;
      border: none;
    }

    .prompt-symbol {
      font-weight: bold;
      color: #9b59b6;
      background: transparent;
      padding: 0;
      border: none;
    }

    .prompt-text {
      opacity: 0.7;
      font-size: 1.1rem;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 8px;
      gap: 8px 10px;
      border: none;
      padding-top: 8px;
    }

    .input-group label {
      font-size: 1.1rem;
      background: transparent;
      padding: 0 4px 0 0;
      border: none;
    }

    #contentIdInput {
      background: transparent;
      border: none;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 1.3rem;
      width: 100px;
      color: #9b59b6;
      text-align: left;
      outline: none;
      box-shadow: none;
      caret-color: #9b59b6;
      border-bottom: 1px dotted #9b59b6;
      border-radius: 0;
      letter-spacing: 0.5px;
      transition: border-color 0.1s;
    }

    #contentIdInput:focus {
      border-bottom: 1px solid #9b59b6;
      background: transparent;
      box-shadow: none;
    }

    .btn {
      background: transparent;
      border: none;
      color: #9b59b6;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: normal;
      padding: 2px 8px;
      cursor: pointer;
      box-shadow: none;
      transition: opacity 0.1s, transform 0.05s;
      text-transform: none;
      letter-spacing: 0.3px;
      opacity: 0.7;
      border: none;
      outline: none;
      text-decoration: underline 1px dotted #9b59b6;
      text-underline-offset: 3px;
    }

    .btn:hover {
      opacity: 1;
      background: transparent;
      text-decoration: underline 1px solid #9b59b6;
      transform: none;
    }

    .btn:active {
      opacity: 0.5;
      transform: none;
    }

    .content-display {
      background: transparent;
      border: none;
      padding: 14px 0 10px 0;
      min-height: 160px;
      box-shadow: none;
      margin-top: 4px;
    }

    .post-body {
      font-size: 1.15rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      background: transparent;
      padding: 4px 0;
      border: none;
      min-height: 60px;
    }

    .post-body p {
      margin-bottom: 0.6rem;
    }

    .error-message {
      display: none;
    }

    .footer-note {
      margin-top: 20px;
      text-align: right;
      font-size: 0.85rem;
      opacity: 0.3;
      border: none;
      padding-top: 12px;
      letter-spacing: 0.3px;
    }

    @media (max-width: 560px) {
      .terminal {
        padding: 16px 12px;
      }
      .prompt-line {
        font-size: 1rem;
      }
      #contentIdInput {
        width: 80px;
        font-size: 1.1rem;
      }
      .btn {
        font-size: 1rem;
        padding: 2px 6px;
      }
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
      background: #000;
    }
    ::-webkit-scrollbar-thumb {
      background: #9b59b6;
      border-radius: 0;
    }
    ::-webkit-scrollbar-track {
      background: #000;
    }
  </style>
</head>
<body>
<div class="terminal">
  <!-- 头部已移除 (display: none) -->

  <div class="input-area">
    <div class="prompt-line">
      <span class="prompt-symbol"></span>
      <span class="prompt-text"></span>
    </div>
    <div class="input-group">
      <label for="contentIdInput"></label>
      <input type="text" id="contentIdInput" placeholder="" value="" maxlength="20" spellcheck="false">
      <button class="btn" id="loadBtn"></button>
      <button class="btn" id="randomBtn"></button>
    </div>
  </div>

  <div class="content-display" id="contentDisplay">
  </div>

  <div class="footer-note"></div>
</div>

<script>
  (function() {
    // ----- 博客数据 (严格按照给定内容) -----
    const posts = {
      '0': {
        id: '0',
        body: `The origin.\nSome say it's trivial; some say it's bizarre. In whichever way, we must proceed.`
      },
      '1': {
        id: '1',
        body: `This marks the beginning of calculations.`
      },
      '2': {
        id: '2',
        body: `This is the number of hands that a common human has.\nOnce we have moved from 1 to 2, it's quite easy to get other following results.`
      },
      '-1': {
        id: '-1',
        body: `The other way.`
      },
      'pi': {
        id: 'pi',
        body: `In a circle and its diameter, in series of integer powers, in elastic collisions, in trigonometry, ...\n... it's everywhere.`
      },
      '9': {
        id: '9',
        body: `在这里插入贝多芬第九交响曲的wiki简介.`
      },
      '18': {
        id: '18',
        body: `在这里插入莎士比亚第14行诗第18首.`
      },
      'i': {
        id: 'i',
        body: `The ninth Latin alphabet.\n... I choose not to make this one a maths reference. Otherwise what about j and k?`
      },
      'I': {
        id: 'I',
        body: `Chances are you are an egotist.`
      },
      '666': {
        id: '666',
        body: `<span class="red-text">Please retry.</span>`
      },
      '10': {
        id: '10',
        body: `We have reached the number of fingers that a common human has.\nHard to say whether good or not that is.`
      },
      'e': {
        id: 'e',
        body: `$$\\frac{1}{0!} + \\frac{1}{1!} + \\frac{1}{2!} + \\cdots$$\n$$\\approx$$\n$$2.7182818284590452353602874713526624977572470936999595749669676277240766303535475945713821785251664274$$`
      }
    };

    const displayEl = document.getElementById('contentDisplay');
    const inputEl = document.getElementById('contentIdInput');
    const loadBtn = document.getElementById('loadBtn');
    const randomBtn = document.getElementById('randomBtn');
    const titleEl = document.getElementById('pageTitle');

    function renderPost(post) {
      if (!post) return null;
      const bodyHtml = post.body
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>')
        .replace(/  /g, '&nbsp;&nbsp;');

      return `<div class="post-body">${bodyHtml}</div>`;
    }

    function clearInputAndDisplay() {
      inputEl.value = '';
      displayEl.innerHTML = '';
      // 清空时标题为空白
      titleEl.textContent = '';
    }

    function loadContentById(id) {
      const raw = String(id);
      if (raw === '') {
        clearInputAndDisplay();
        return;
      }

      const found = posts.hasOwnProperty(raw) ? posts[raw] : null;
      if (found) {
        // 更新网站标题为编号或字符串
        titleEl.textContent = raw;
        const html = renderPost(found);
        if (html) {
          displayEl.innerHTML = html;
          if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(function(err) {});
          }
        } else {
          clearInputAndDisplay();
        }
      } else {
        clearInputAndDisplay();
      }
    }

    function loadRandom() {
      const keys = Object.keys(posts);
      if (keys.length === 0) {
        clearInputAndDisplay();
        return;
      }
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      inputEl.value = randomKey;
      loadContentById(randomKey);
    }

    function init() {
      displayEl.innerHTML = '';
      inputEl.value = '';
      titleEl.textContent = '';

      loadBtn.addEventListener('click', function(e) {
        const val = inputEl.value;
        const trimmed = val.trim();
        if (trimmed === '') {
          clearInputAndDisplay();
          return;
        }
        loadContentById(val);
      });

      randomBtn.addEventListener('click', function(e) {
        loadRandom();
      });

      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = inputEl.value;
          const trimmed = val.trim();
          if (trimmed === '') {
            clearInputAndDisplay();
            return;
          }
          loadContentById(val);
        }
      });

      inputEl.addEventListener('focus', function() {
        this.select();
      });
    }

    init();
  })();
</script>
</body>
</html>
