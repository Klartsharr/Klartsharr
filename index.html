<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, 'Nouveau IBM', 'VT323', monospace;
      padding: 16px;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      transition: background-color 2s ease;
      position: relative;
      overflow-x: hidden;
    }

    .square-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .square-container.active {
      opacity: 1;
    }

    .square {
      position: absolute;
      background: #000000;
      opacity: 0;
      animation: slideDiagonal var(--duration, 4s) ease-in forwards;
      animation-delay: var(--delay, 0s);
      width: var(--size, 8px);
      height: var(--size, 8px);
    }

    @keyframes slideDiagonal {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.3);
      }
      10% {
        opacity: 0.85;
      }
      90% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.2);
      }
    }

    .terminal {
      max-width: 820px;
      width: 100%;
      background: #000000;
      padding: 24px 20px 28px;
      transition: background-color 2s ease;
      position: relative;
      z-index: 1;
    }

    .terminal, .terminal * {
      color: #9b59b6;
      font-weight: 400;
      letter-spacing: 0.3px;
      text-shadow: none;
    }

    body.bg-white {
      background: #ffffff;
    }
    body.bg-white .terminal {
      background: #ffffff;
    }
    body.bg-white .terminal,
    body.bg-white .terminal * {
      color: #000000 !important;
    }
    body.bg-white .MathJax_SVG,
    body.bg-white .MathJax {
      color: #000000 !important;
      fill: #000000 !important;
    }
    body.bg-white .MathJax_SVG * {
      color: #000000 !important;
      fill: #000000 !important;
    }
    body.bg-white .MathJax_SVG g path,
    body.bg-white .MathJax_SVG g rect,
    body.bg-white .MathJax_SVG g use {
      stroke: #000000 !important;
      fill: #000000 !important;
    }
    body.bg-white .MathJax_SVG mtext,
    body.bg-white .MathJax_SVG mi,
    body.bg-white .MathJax_SVG mn,
    body.bg-white .MathJax_SVG mo {
      fill: #000000 !important;
      color: #000000 !important;
    }
    body.bg-white .audio-btn {
      background: #000000 !important;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3) !important;
    }
    body.bg-white .audio-btn:hover {
      background: #333333 !important;
    }
    body.bg-white .red-text {
      color: #ff0000 !important;
    }
    body.bg-white .black-text {
      color: #000000 !important;
    }
    body.bg-white .btn {
      color: #000000 !important;
      text-decoration-color: #000000 !important;
    }
    body.bg-white .btn:hover {
      color: #000000 !important;
    }
    body.bg-white #contentIdInput {
      color: #000000 !important;
      border-bottom-color: #000000 !important;
      caret-color: #000000 !important;
    }
    body.bg-white #contentIdInput:focus {
      border-bottom-color: #000000 !important;
    }
    body.bg-white .color-btn {
      border-color: #000000 !important;
    }
    body.bg-white .square {
      background: #000000;
    }

    .input-area.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .problem-text {
      margin-bottom: 1rem;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .answer-input {
      width: 120px;
      background: transparent;
      border: none;
      border-bottom: 1px dotted #9b59b6;
      padding: 6px 4px;
      color: #9b59b6;
      font-family: inherit;
      font-size: 1.2rem;
      outline: none;
      caret-color: #9b59b6;
      transition: border-color 0.2s ease;
    }

    .answer-input:focus {
      border-bottom: 1px solid #9b59b6;
    }

    .answer-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }

    .answer-replacement {
      color: #9b59b6;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .problem-message {
      margin-top: 1rem;
      font-size: 1.25rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .correct-message {
      animation: pulseColor 2.5s ease-in-out infinite;
      text-shadow: 0 0 12px rgba(255, 0, 0, 0.75), 0 0 24px rgba(138, 43, 226, 0.55);
    }

    @keyframes pulseColor {
      0% { color: #ff0000; text-shadow: 0 0 12px rgba(255, 0, 0, 0.75), 0 0 24px rgba(255, 127, 0, 0.55); }
      20% { color: #ff7f00; text-shadow: 0 0 12px rgba(255, 127, 0, 0.75), 0 0 24px rgba(255, 255, 0, 0.55); }
      40% { color: #ffff00; text-shadow: 0 0 12px rgba(255, 255, 0, 0.75), 0 0 24px rgba(0, 255, 0, 0.55); }
      60% { color: #0000ff; text-shadow: 0 0 12px rgba(0, 0, 255, 0.75), 0 0 24px rgba(138, 43, 226, 0.55); }
      80% { color: #8a2be2; text-shadow: 0 0 12px rgba(138, 43, 226, 0.75), 0 0 24px rgba(255, 0, 255, 0.55); }
      100% { color: #ff0000; text-shadow: 0 0 12px rgba(255, 0, 0, 0.75), 0 0 24px rgba(255, 127, 0, 0.55); }
    }

    .answer-display {
      margin-top: 0.8rem;
      font-size: 1.2rem;
    }

    .hidden-element {
      display: none !important;
    }

    .fade-in {
      opacity: 1 !important;
      transition: opacity 0.5s ease;
    }

    .faded-out {
      opacity: 0 !important;
    }

    .MathJax_SVG, .MathJax {
      color: #9b59b6 !important;
      fill: #9b59b6 !important;
    }
    .MathJax_SVG * {
      color: #9b59b6 !important;
      fill: #9b59b6 !important;
    }
    .MathJax_SVG g path, .MathJax_SVG g rect, .MathJax_SVG g use {
      stroke: #9b59b6 !important;
      fill: #9b59b6 !important;
    }
    .MathJax_SVG mtext, .MathJax_SVG mi, .MathJax_SVG mn, .MathJax_SVG mo {
      fill: #9b59b6 !important;
      color: #9b59b6 !important;
    }

    .red-text {
      color: #ff0000 !important;
    }

    .black-text {
      color: #000000 !important;
    }

    .audio-btn {
      display: inline-block;
      width: 48px;
      height: 48px;
      background: #9b59b6;
      border: none;
      color: #000000 !important;
      font-size: 0;
      cursor: pointer;
      padding: 0;
      margin: 8px 0;
      transition: all 0.15s;
      box-shadow: 0 0 15px rgba(155, 89, 182, 0.3);
      border-radius: 0 !important;
    }

    .audio-btn:hover {
      background: #8e44ad;
      box-shadow: 0 0 25px rgba(155, 89, 182, 0.6);
      transform: scale(1.05);
    }

    .audio-btn:active {
      transform: scale(0.92);
    }

    .audio-info {
      display: none;
      margin-top: 8px;
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.9;
    }

    .audio-info.playing {
      display: block;
    }

    .audio-title {
      font-weight: bold;
      font-size: 1.3rem;
    }

    .audio-credit {
      font-size: 0.95rem;
      opacity: 0.6;
      margin-top: 2px;
    }

    .color-buttons {
      display: flex;
      gap: 12px;
      margin: 12px 0 8px 0;
      flex-wrap: wrap;
    }

    .color-btn {
      width: 40px;
      height: 40px;
      border: 2px solid #9b59b6;
      border-radius: 0 !important;
      cursor: pointer;
      transition: all 0.2s;
      padding: 0;
    }

    .color-btn:hover {
      transform: scale(1.1);
    }

    .color-btn:active {
      transform: scale(0.9);
    }

    .color-btn-red {
      background: #ff0000;
      border-color: #ff0000;
    }

    .color-btn-yellow {
      background: #ffd700;
      border-color: #ffd700;
    }

    .color-btn-blue {
      background: #87ceeb;
      border-color: #87ceeb;
    }

    .cloud-image {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 80%;
      max-height: 80%;
      opacity: 0;
      transition: opacity 2s ease;
      pointer-events: none;
      z-index: 999;
    }

    .cloud-image.show {
      opacity: 1;
    }

    .cmd-header {
      display: none;
    }

    .input-area {
      background: transparent;
      border: none;
      padding: 12px 0 16px 0;
      box-shadow: none;
      margin-bottom: 16px;
    }

    .prompt-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      font-size: 1.3rem;
      border: none;
    }

    .prompt-symbol {
      font-weight: bold;
      color: #9b59b6;
      background: transparent;
      padding: 0;
      border: none;
    }

    .prompt-text {
      opacity: 0.7;
      font-size: 1.1rem;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 8px;
      gap: 8px 10px;
      border: none;
      padding-top: 8px;
    }

    .input-group label {
      font-size: 1.1rem;
      background: transparent;
      padding: 0 4px 0 0;
      border: none;
    }

    #contentIdInput {
      background: transparent;
      border: none;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 1.3rem;
      width: 120px;
      color: #9b59b6;
      text-align: left;
      outline: none;
      box-shadow: none;
      caret-color: #9b59b6;
      border-bottom: 1px dotted #9b59b6;
      border-radius: 0;
      letter-spacing: 0.5px;
      transition: border-color 0.1s;
    }

    #contentIdInput:focus {
      border-bottom: 1px solid #9b59b6;
      background: transparent;
      box-shadow: none;
    }

    .btn {
      background: transparent;
      border: none;
      color: #9b59b6;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: normal;
      padding: 2px 8px;
      cursor: pointer;
      box-shadow: none;
      transition: opacity 0.1s, transform 0.05s;
      text-transform: none;
      letter-spacing: 0.3px;
      opacity: 0.7;
      border: none;
      outline: none;
      text-decoration: underline 1px dotted #9b59b6;
      text-underline-offset: 3px;
    }

    .btn:hover {
      opacity: 1;
      background: transparent;
      text-decoration: underline 1px solid #9b59b6;
      transform: none;
    }

    .btn:active {
      opacity: 0.5;
      transform: none;
    }

    .content-display {
      background: transparent;
      border: none;
      padding: 14px 0 10px 0;
      min-height: 160px;
      box-shadow: none;
      margin-top: 4px;
    }

    .post-body {
      font-size: 1.15rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      background: transparent;
      padding: 4px 0;
      border: none;
      min-height: 60px;
    }

    .post-body p {
      margin-bottom: 0.6rem;
    }

    .error-message {
      display: none;
    }

    .footer-note {
      margin-top: 20px;
      text-align: right;
      font-size: 0.85rem;
      opacity: 0.3;
      border: none;
      padding-top: 12px;
      letter-spacing: 0.3px;
    }

    @media (max-width: 560px) {
      .terminal {
        padding: 16px 12px;
      }
      .prompt-line {
        font-size: 1rem;
      }
      #contentIdInput {
        width: 100px;
        font-size: 1.1rem;
      }
      .btn {
        font-size: 1rem;
        padding: 2px 6px;
      }
      .audio-btn {
        width: 40px;
        height: 40px;
      }
      .color-btn {
        width: 34px;
        height: 34px;
      }
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
      background: #000;
    }
    ::-webkit-scrollbar-thumb {
      background: #9b59b6;
      border-radius: 0;
    }
    ::-webkit-scrollbar-track {
      background: #000;
    }
  </style>
</head>

<script>
  (function() {
    function getNow() { return new Date(); }
    function isAugust11(date) { return date.getMonth() === 7 && date.getDate() === 11; }
    function isBefore20080811(date) { return date.getTime() < new Date(2008, 7, 11).getTime(); }
    function get20080811Content() {
      const now = getNow();
      if (isBefore20080811(now)) return '...';
      if (isAugust11(now)) return `This is someone's ${now.getFullYear() - 2008}th birthday.`;
      return '...';
    }

    const AUDIO_URL_20260702 = '20260702.mp3';
    const AUDIO_URL_TEST_BGM = 'testentry.mp3';
    const AUDIO_URL_YELLOW = 'button1.mp3';
    const AUDIO_URL_20260703_CORRECT = 'YES!!!.mp3';
    const AUDIO_URL_20260703_WRONG = 'expl.mp3';
    const AUDIO_URL_20260703_BGM = 'Noooo.mp3';  // 答题界面背景音乐
    const CLOUD_IMAGE_URL = 'testcloud.png';
    const EFFECT_PAUSE_DURATION = 4000;

    let currentId = '';
    let currentAudio = null;
    let bgTimer = null;
    let isBgWhite = false;
    let squareInterval = null;
    let isSquareRunning = false;
    let specialAudio = null;
    let specialAudioLoopHandler = null;
    let problemEntryActive = false;
    let topInputRestoreTimer = null;

    const posts = {
      '0': { id: '0', body: `The origin.\nSome say it's trivial; some say it's bizarre. In whichever way, we must proceed.` },
      '1': { id: '1', body: `This marks the beginning of calculations.` },
      '2': { id: '2', body: `This is the number of hands that a common human has.\nOnce we have moved from 1 to 2, it's quite easy to get other following results.` },
      '-1': { id: '-1', body: `The other way.` },
      'pi': { id: 'pi', body: `In a circle and its diameter, in series of integer powers, in elastic collisions, in trigonometry, ...\n... it's everywhere.` },
      '9': { id: '9', body: `Ludwig van Beethoven's Symphony No. 9 in D minor, Op. 125, is a choral symphony, the final complete symphony by Beethoven, composed between 1822 and 1824. It was first performed in Vienna on 7 May 1824. The symphony is regarded by many critics and musicologists as Beethoven's greatest work and one of the supreme achievements in the history of music. One of the best-known works in common practice music, it stands as one of the most frequently performed symphonies in the world. The symphony was the first example of a major composer using voices in a symphony. The text is adapted from Friedrich Schiller's poem "Ode to Joy".` },
      '18': { id: '18', body: `Shall I compare thee to a summer's day?\nThou art more lovely and more temperate:\nRough winds do shake the darling buds of May,\nAnd summer's lease hath all too short a date;\nSometime too hot the eye of heaven shines,\nAnd often is his gold complexion dimm'd;\nAnd every fair from fair sometime declines,\nBy chance or nature's changing course untrimm'd;\nBut thy eternal summer shall not fade,\nNor lose possession of that fair thou ow'st;\nNor shall death brag thou wander'st in his shade,\nWhen in eternal lines to time thou grow'st:\nSo long as men can breathe or eyes can see,\nSo long lives this, and this gives life to thee.` },
      'i': { id: 'i', body: `The ninth Latin alphabet.\n... I choose not to make this one a maths reference. Otherwise what about j and k?` },
      'I': { id: 'I', body: `Chances are you are an egotist.` },
      '666': { id: '666', body: `Please retry.`, isRed: true },
      '10': { id: '10', body: `We have reached the number of fingers that a common human has.\nHard to say whether good or not that is.` },
      'e': { id: 'e', body: `$$\\frac{1}{0!} + \\frac{1}{1!} + \\frac{1}{2!} + \\cdots$$\n$$\\approx$$\n$$2.7182818284590452353602874713526624977572470936999595749669676277240766303535475945713821785251664274$$` },
      '20150915': { id: '20150915', body: `... was when we witnessed the release of a really nice game.` },
      '20080811': { id: '20080811', body: get20080811Content(), isDynamic: true },
      '19980829': { id: '19980829', body: '', isEmpty: true },
      '1225': { id: '1225', body: `Don't forget.` },
      'Klartsharr': { id: 'Klartsharr', body: `Oh, where did you get that name?` },
      'klartsharr': { id: 'klartsharr', body: `Spell it into a Name, would you?` },
      'KLARTSHARR': { id: 'KLARTSHARR', body: `STOP.` },
      '20260702': { id: '20260702', body: 'AUDIO_PLACEHOLDER', hasAudio: true, audioUrl: AUDIO_URL_20260702, audioTitle: 'Scarlet Forest', audioCredit: 'From DELTARUNE Chapter 1 by Toby Fox.' },
      '20260703': { id: '20260703', body: 'PROBLEM_ENTRY_PLACEHOLDER', isProblemEntry: true },
      '20260616': { id: '20260616', body: `Piano Concerto in A Major\n\nThis concerto is dedicated to a most supportive friend of mine. Only with his calm, constant and heartfelt company could I conceive such peaceful melodies. Included in the Andante movement is a passage adapted from a very early prelude for piano solo of his, by which I first became acquainted with him during my last years of elementary school. Six years have passed since then, and I have graduated from high school. No word might possibly express the slightest of my gratitude for such a precious confidant, my dearest doctor of Mathematics who has always been with me in my teenage years.` },
      'testentry': { id: 'testentry', body: 'TEST_ENTRY_PLACEHOLDER', isTestEntry: true }
    };

    const displayEl = document.getElementById('contentDisplay');
    const inputEl = document.getElementById('contentIdInput');
    const loadBtn = document.getElementById('loadBtn');
    const randomBtn = document.getElementById('randomBtn');
    const titleEl = document.getElementById('pageTitle');
    const cloudContainer = document.getElementById('cloudContainer');
    const cloudImg = document.getElementById('cloudImg');
    const squareContainer = document.getElementById('squareContainer');

    // ----- 背景音乐独立管理 -----
    let bgmAudio = null;
    let isBgmPlaying = false;
    let bgmResumeTimer = null;
    let isBgmPausedForEffect = false;  // 标记是否因按钮效果而暂停

    // ============================================================
    // ★★★ 音频停止函数：停止所有正在播放的音频 ★★★
    // ============================================================
    function stopSpecialAudio() {
      if (specialAudio) {
        specialAudio.pause();
        specialAudio.removeEventListener('timeupdate', specialAudioLoopHandler);
        specialAudio = null;
      }
      specialAudioLoopHandler = null;
    }

    function stopAllAudio() {
      // 停止 20260702 的音频
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
        const infoEl = document.getElementById('audioInfo');
        if (infoEl) infoEl.classList.remove('playing');
      }
      // 停止 testentry 的背景音乐
      if (bgmAudio) {
        bgmAudio.pause();
        bgmAudio = null;
        isBgmPlaying = false;
        isBgmPausedForEffect = false;
      }
      stopSpecialAudio();
      clearTimeout(bgmResumeTimer);
      bgmResumeTimer = null;
    }

    function startSpecialAudioLoop(url) {
      stopSpecialAudio();
      specialAudio = new Audio(url);
      specialAudio.loop = false;
      specialAudio.preload = 'auto';
      function onTimeUpdate() {
        if (!specialAudio || !specialAudio.duration || specialAudio.duration <= 3) return;
        if (specialAudio.currentTime >= specialAudio.duration - 3) {
          specialAudio.currentTime = 0;
          specialAudio.play().catch(function(err) { console.log('special audio replay failed:', err); });
        }
      }
      specialAudioLoopHandler = onTimeUpdate;
      specialAudio.addEventListener('timeupdate', onTimeUpdate);
      specialAudio.play().catch(function(err) {
        console.log('special audio play failed:', err);
      });
    }

    function playAudioOnce(url) {
      const audio = new Audio(url);
      audio.preload = 'auto';
      audio.play().catch(function(err) {
        console.log('audio play once failed:', err);
      });
    }

    function hideTopInputArea() {
      const inputArea = document.querySelector('.input-area');
      if (inputArea) {
        inputArea.classList.add('hidden');
      }
    }

    function showTopInputArea() {
      const inputArea = document.querySelector('.input-area');
      if (inputArea) {
        inputArea.classList.remove('hidden');
      }
    }

    function resetToInitialState() {
      stopAllAudio();
      clearTimeout(bgTimer);
      if (isBgWhite) {
        document.body.classList.remove('bg-white');
        isBgWhite = false;
        stopSquares();
      }
      clearTimeout(topInputRestoreTimer);
      topInputRestoreTimer = null;
      problemEntryActive = false;
      currentId = '';
      titleEl.textContent = '';
      displayEl.innerHTML = '';
      inputEl.value = '';
      showTopInputArea();
    }

    function scheduleTopInputRestore(delay) {
      clearTimeout(topInputRestoreTimer);
      topInputRestoreTimer = setTimeout(function() {
        showTopInputArea();
      }, delay);
    }

    function processResetCommand(value) {
      const trimmed = String(value).trim();
      if (!problemEntryActive) return false;
      if (trimmed === '切换条目' || trimmed === '回到黑屏') {
        resetToInitialState();
        return true;
      }
      return false;
    }

    // ----- 黑色小方块：持续追加，不删除旧方块 -----
    function addSquareBatch() {
      if (!isSquareRunning) return;
      
      const container = squareContainer;
      const count = 15 + Math.floor(Math.random() * 15);
      
      for (let i = 0; i < count; i++) {
        const square = document.createElement('div');
        square.className = 'square';
        
        const startX = Math.random() * 90;
        const startY = Math.random() * 90;
        square.style.left = startX + '%';
        square.style.top = startY + '%';
        
        const targetX = (100 - startX) * 0.8 + 10;
        const targetY = (100 - startY) * 0.8 + 10;
        square.style.setProperty('--tx', targetX + 'vw');
        square.style.setProperty('--ty', targetY + 'vh');
        
        square.style.setProperty('--delay', (Math.random() * 0.8) + 's');
        const size = 4 + Math.random() * 10;
        square.style.setProperty('--size', size + 'px');
        square.style.setProperty('--duration', (3 + Math.random() * 3) + 's');
        
        container.appendChild(square);
      }
    }

    function startSquares() {
      if (isSquareRunning) return;
      isSquareRunning = true;
      squareContainer.innerHTML = '';
      squareContainer.classList.add('active');
      
      addSquareBatch();
      squareInterval = setInterval(function() {
        if (isSquareRunning) {
          addSquareBatch();
        }
      }, 1500);
    }

    function stopSquares() {
      isSquareRunning = false;
      if (squareInterval) {
        clearInterval(squareInterval);
        squareInterval = null;
      }
      squareContainer.classList.remove('active');
      setTimeout(function() {
        if (!isSquareRunning) {
          squareContainer.innerHTML = '';
        }
      }, 8000);
    }

    // ----- 背景变白（只在 testentry 中生效） -----
    function startBgTimer() {
      clearTimeout(bgTimer);
      bgTimer = setTimeout(function() {
        if (currentId === 'testentry') {
          document.body.classList.add('bg-white');
          isBgWhite = true;
          startSquares();
        }
      }, 60000);
    }

    function resetBgTimer() {
      clearTimeout(bgTimer);
      if (isBgWhite) {
        document.body.classList.remove('bg-white');
        isBgWhite = false;
        stopSquares();
      }
      if (currentId === 'testentry') {
        startBgTimer();
      }
    }

    // ----- 背景音乐控制（仅 testentry） -----
    function startBgm() {
      clearTimeout(bgmResumeTimer);
      if (bgmAudio) { 
        bgmAudio.pause(); 
        bgmAudio = null; 
      }
      bgmAudio = new Audio(AUDIO_URL_TEST_BGM);
      bgmAudio.loop = true;
      bgmAudio.play().catch(function(err) { 
        console.log('背景音乐播放失败:', err); 
      });
      isBgmPlaying = true;
      isBgmPausedForEffect = false;
    }

    // 暂停背景音乐（用于按钮效果）
    function pauseBgmForEffect() {
      if (!bgmAudio || !isBgmPlaying) return;
      clearTimeout(bgmResumeTimer);
      bgmAudio.pause();
      isBgmPlaying = false;
      isBgmPausedForEffect = true;
    }

    // 恢复背景音乐（按钮效果结束后调用）
    function resumeBgmAfterEffect() {
      clearTimeout(bgmResumeTimer);
      if (bgmAudio && !isBgmPlaying && isBgmPausedForEffect) {
        bgmAudio.play().catch(function(err) {
          console.log('背景音乐恢复失败:', err);
        });
        isBgmPlaying = true;
        isBgmPausedForEffect = false;
      } else if (!bgmAudio) {
        startBgm();
      }
    }

    // 按钮效果统一处理：暂停背景音乐，延迟后恢复
    function handleButtonEffect() {
      pauseBgmForEffect();
      clearTimeout(bgmResumeTimer);
      bgmResumeTimer = setTimeout(function() {
        resumeBgmAfterEffect();
      }, EFFECT_PAUSE_DURATION);
    }

    // ----- 渲染 -----
    function renderPost(post, id) {
      if (!post) return null;
      if (post.isEmpty) return '';
      if (post.hasAudio) {
        return `<div class="post-body">
          <button id="playAudioBtn" class="audio-btn"></button>
          <div id="audioInfo" class="audio-info">
            <div class="audio-title">${post.audioTitle}</div>
            <div class="audio-credit">${post.audioCredit}</div>
          </div>
        </div>`;
      }
      if (post.isTestEntry) {
        return `<div class="post-body">
          <div>This is a test entry. Feel free to activate the buttons, and everything else...</div>
          <div class="black-text">... including this.</div>
          <div class="color-buttons">
            <button class="color-btn color-btn-red" data-color="red"></button>
            <button class="color-btn color-btn-yellow" data-color="yellow"></button>
            <button class="color-btn color-btn-blue" data-color="blue"></button>
          </div>
          <div id="testEntryResult"></div>
        </div>`;
      }
      if (post.isProblemEntry) {
        return `<div class="post-body">
          <div class="problem-text">Let $PS$, $PT$ be two lines tangent to parabola $y^{2}=2px$ at two distinct points $S$ and $T$ which intersect at point $P$. Given that $|PS|=3$, $|PT|=4$, $|ST|=5$, we can calculate that $|p|=$</div>
          <div class="answer-row" id="problemAnswerRow">
            <input id="problemAnswerInput" class="answer-input" type="text" autocomplete="off">
          </div>
          <div id="problemMessage" class="problem-message"></div>
        </div>`;
      }
      let bodyText = post.isDynamic ? get20080811Content() : post.body;
      let bodyHtml = bodyText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>').replace(/  /g, '&nbsp;&nbsp;');
      if (post.isRed) bodyHtml = `<span class="red-text">${bodyHtml}</span>`;
      return `<div class="post-body">${bodyHtml}</div>`;
    }

    function bindAudioButton(post) {
      if (!post || !post.hasAudio) return;
      const btn = document.getElementById('playAudioBtn');
      const infoEl = document.getElementById('audioInfo');
      if (btn) {
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        newBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
            if (infoEl) infoEl.classList.remove('playing');
            return;
          }
          const audio = new Audio(post.audioUrl);
          currentAudio = audio;
          if (infoEl) infoEl.classList.add('playing');
          audio.play().then(function() {
            audio.addEventListener('ended', function() {
              currentAudio = null;
              if (infoEl) infoEl.classList.remove('playing');
            });
          }).catch(function(err) {
            console.log('音频播放失败:', err);
            currentAudio = null;
            if (infoEl) infoEl.classList.remove('playing');
          });
        });
      }
    }

    function bindTestEntryButtons() {
      const redBtn = document.querySelector('.color-btn-red');
      const yellowBtn = document.querySelector('.color-btn-yellow');
      const blueBtn = document.querySelector('.color-btn-blue');
      const resultEl = document.getElementById('testEntryResult');
      let redTextElement = null;

      function clearOtherEffects(keepColor) {
        if (keepColor !== 'red') {
          const redText = resultEl.querySelector('.red-text-result');
          if (redText) { redText.remove(); redTextElement = null; }
        }
        if (keepColor !== 'blue') cloudContainer.classList.remove('show');
      }

      if (redBtn) {
        redBtn.addEventListener('click', function() {
          clearOtherEffects('red');
          const existingRed = resultEl.querySelector('.red-text-result');
          if (existingRed) {
            existingRed.remove();
            redTextElement = null;
            // 移除文字时立即恢复背景音乐
            clearTimeout(bgmResumeTimer);
            resumeBgmAfterEffect();
          } else {
            const div = document.createElement('div');
            div.className = 'red-text red-text-result';
            div.textContent = 'My apologies to all of these.';
            resultEl.appendChild(div);
            redTextElement = div;
            // 统一处理按钮效果
            handleButtonEffect();
          }
        });
      }
      if (yellowBtn) {
        yellowBtn.addEventListener('click', function() {
          clearOtherEffects('yellow');
          const audio = new Audio(AUDIO_URL_YELLOW);
          audio.play().catch(function(err) { console.log('黄色音效播放失败:', err); });
          handleButtonEffect();
        });
      }
      if (blueBtn) {
        blueBtn.addEventListener('click', function() {
          clearOtherEffects('blue');
          cloudImg.src = CLOUD_IMAGE_URL;
          cloudContainer.classList.add('show');
          handleButtonEffect();
          setTimeout(function() { cloudContainer.classList.remove('show'); }, 2000);
        });
      }
    }

    function bind20260703AnswerInput() {
      const answerInput = document.getElementById('problemAnswerInput');
      const answerRow = document.getElementById('problemAnswerRow');
      const messageEl = document.getElementById('problemMessage');
      if (!answerInput || !answerRow || !messageEl) return;

      function showCorrectAnswer() {
        document.body.classList.add('bg-white');
        isBgWhite = true;
        startSquares();
        stopSpecialAudio();
        playAudioOnce(AUDIO_URL_20260703_CORRECT);
        answerRow.innerHTML = `<span id="problemAnswerDisplay" class="answer-display">$$\\dfrac{288}{125}$$</span>`;
        messageEl.innerHTML = `<span class="correct-message">THAT'S RIGHT! A REALLY BAD-LOOKING ANSWER!!!</span>`;
        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetPromise().catch(function(err) {});
        }
      }

      function showAlternateAnswer(normalized) {
        stopSpecialAudio();
        playAudioOnce(AUDIO_URL_20260703_WRONG);
        answerRow.innerHTML = `<div class="answer-replacement">You answered ${normalized}.<br>So that's the best you could imagine???</div>`;
        messageEl.textContent = '';
      }

      function handleProblemAnswer(value) {
        const normalized = String(value).trim();
        if (!normalized) return;

        const correctSet = new Set(['\\dfrac{288}{125}', '288/125', '2.304']);
        const alternateSet = new Set(['24/7','25/7','24/25','4/3','5/3','5/4','1','1.25','1.5','3/2','5/2','2','2.5','3','4']);

        if (correctSet.has(normalized)) {
          showCorrectAnswer();
          scheduleTopInputRestore(5000);
        } else if (alternateSet.has(normalized)) {
          showAlternateAnswer(normalized);
          scheduleTopInputRestore(5000);
        } else {
          resetToInitialState();
        }
      }

      answerInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const value = answerInput.value;
          if (processResetCommand(value)) return;
          handleProblemAnswer(value);
        }
      });
    }

    // ----- 加载内容 -----
    function loadContentById(id) {
      const raw = String(id);
      if (raw === '') {
        inputEl.value = ''; displayEl.innerHTML = ''; titleEl.textContent = ''; 
        stopAllAudio();
        clearTimeout(bgTimer);
        if (isBgWhite) {
          document.body.classList.remove('bg-white');
          isBgWhite = false;
          stopSquares();
        }
        currentId = '';
        return;
      }
      const found = posts.hasOwnProperty(raw) ? posts[raw] : null;
      if (found) {
        stopAllAudio();
        
        currentId = raw;
        titleEl.textContent = raw;
        
        clearTimeout(bgTimer);
        if (isBgWhite) {
          document.body.classList.remove('bg-white');
          isBgWhite = false;
          stopSquares();
        }
        if (found.isTestEntry) {
          startBgTimer();
        }
        
        if (found.isEmpty) { displayEl.innerHTML = ''; return; }
        currentId = raw;
        if (found.isProblemEntry) {
          problemEntryActive = true;
        } else {
          problemEntryActive = false;
        }
        const html = renderPost(found, raw);
        if (html !== null && html !== '') {
          displayEl.innerHTML = html;
          if (found.hasAudio) bindAudioButton(found);
          if (found.isTestEntry) {
            startBgm();
            bindTestEntryButtons();
            if (isBgWhite) startSquares();
          }
          if (found.isProblemEntry) {
            hideTopInputArea();
            startSpecialAudioLoop(AUDIO_URL_20260703_BGM);
            bind20260703AnswerInput();
          } else {
            showTopInputArea();
          }
          if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(function(err) {});
          }
        } else { displayEl.innerHTML = ''; }
      } else {
        inputEl.value = ''; displayEl.innerHTML = ''; titleEl.textContent = ''; 
        stopAllAudio();
        clearTimeout(bgTimer);
        if (isBgWhite) {
          document.body.classList.remove('bg-white');
          isBgWhite = false;
          stopSquares();
        }
        currentId = '';
      }
    }

    function refreshCurrentContent() {
      if (currentId && posts.hasOwnProperty(currentId)) {
        const post = posts[currentId];
        if (post.isDynamic) {
          const html = renderPost(post, currentId);
          if (html !== null && html !== '') {
            displayEl.innerHTML = html;
            if (window.MathJax && MathJax.typesetPromise) {
              MathJax.typesetPromise().catch(function(err) {});
            }
          }
        }
      }
    }

    function loadRandom() {
      const keys = Object.keys(posts);
      if (keys.length === 0) {
        inputEl.value = ''; displayEl.innerHTML = ''; titleEl.textContent = ''; 
        stopAllAudio();
        clearTimeout(bgTimer);
        if (isBgWhite) {
          document.body.classList.remove('bg-white');
          isBgWhite = false;
          stopSquares();
        }
        currentId = '';
        return;
      }
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      inputEl.value = randomKey;
      loadContentById(randomKey);
    }

    function init() {
      displayEl.innerHTML = '';
      inputEl.value = '';
      titleEl.textContent = '';
      currentId = '';

      loadBtn.addEventListener('click', function(e) {
        const val = inputEl.value;
        const trimmed = val.trim();
        if (trimmed === '') {
          inputEl.value = ''; displayEl.innerHTML = ''; titleEl.textContent = ''; 
          stopAllAudio();
          clearTimeout(bgTimer);
          if (isBgWhite) {
            document.body.classList.remove('bg-white');
            isBgWhite = false;
            stopSquares();
          }
          currentId = '';
          return;
        }
        loadContentById(val);
      });

      randomBtn.addEventListener('click', function(e) { loadRandom(); });

      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = inputEl.value;
          const trimmed = val.trim();
          if (trimmed === '') {
            inputEl.value = ''; displayEl.innerHTML = ''; titleEl.textContent = ''; 
            stopAllAudio();
            clearTimeout(bgTimer);
            if (isBgWhite) {
              document.body.classList.remove('bg-white');
              isBgWhite = false;
              stopSquares();
            }
            currentId = '';
            return;
          }
          if (processResetCommand(trimmed)) {
            return;
          }
          if (processResetCommand(trimmed)) {
            return;
          }
          loadContentById(val);
        }
      });

      inputEl.addEventListener('focus', function() { this.select(); });

      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) refreshCurrentContent();
      });

      setInterval(function() { refreshCurrentContent(); }, 60000);
    }

    init();
  })();
</script>
