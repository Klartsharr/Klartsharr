<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title id="pageTitle"></title>
  <!-- MathJax 配置与加载 -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, 'Nouveau IBM', 'VT323', monospace;
      padding: 16px;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    }

    .terminal {
      max-width: 820px;
      width: 100%;
      background: #000000;
      padding: 24px 20px 28px;
    }

    .terminal, .terminal * {
      color: #9b59b6;
      font-weight: 400;
      letter-spacing: 0.3px;
      text-shadow: none;
    }

    .MathJax_SVG, .MathJax {
      color: #9b59b6 !important;
      fill: #9b59b6 !important;
    }
    .MathJax_SVG * {
      color: #9b59b6 !important;
      fill: #9b59b6 !important;
    }
    .MathJax_SVG g path, .MathJax_SVG g rect, .MathJax_SVG g use {
      stroke: #9b59b6 !important;
      fill: #9b59b6 !important;
    }
    .MathJax_SVG mtext, .MathJax_SVG mi, .MathJax_SVG mn, .MathJax_SVG mo {
      fill: #9b59b6 !important;
      color: #9b59b6 !important;
    }

    /* 红色字体用于 666 */
    .red-text {
      color: #ff0000 !important;
    }

    .cmd-header {
      display: none;
    }

    .input-area {
      background: transparent;
      border: none;
      padding: 12px 0 16px 0;
      box-shadow: none;
      margin-bottom: 16px;
    }

    .prompt-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      font-size: 1.3rem;
      border: none;
    }

    .prompt-symbol {
      font-weight: bold;
      color: #9b59b6;
      background: transparent;
      padding: 0;
      border: none;
    }

    .prompt-text {
      opacity: 0.7;
      font-size: 1.1rem;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 8px;
      gap: 8px 10px;
      border: none;
      padding-top: 8px;
    }

    .input-group label {
      font-size: 1.1rem;
      background: transparent;
      padding: 0 4px 0 0;
      border: none;
    }

    #contentIdInput {
      background: transparent;
      border: none;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 1.3rem;
      width: 120px;
      color: #9b59b6;
      text-align: left;
      outline: none;
      box-shadow: none;
      caret-color: #9b59b6;
      border-bottom: 1px dotted #9b59b6;
      border-radius: 0;
      letter-spacing: 0.5px;
      transition: border-color 0.1s;
    }

    #contentIdInput:focus {
      border-bottom: 1px solid #9b59b6;
      background: transparent;
      box-shadow: none;
    }

    .btn {
      background: transparent;
      border: none;
      color: #9b59b6;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: normal;
      padding: 2px 8px;
      cursor: pointer;
      box-shadow: none;
      transition: opacity 0.1s, transform 0.05s;
      text-transform: none;
      letter-spacing: 0.3px;
      opacity: 0.7;
      border: none;
      outline: none;
      text-decoration: underline 1px dotted #9b59b6;
      text-underline-offset: 3px;
    }

    .btn:hover {
      opacity: 1;
      background: transparent;
      text-decoration: underline 1px solid #9b59b6;
      transform: none;
    }

    .btn:active {
      opacity: 0.5;
      transform: none;
    }

    .content-display {
      background: transparent;
      border: none;
      padding: 14px 0 10px 0;
      min-height: 160px;
      box-shadow: none;
      margin-top: 4px;
    }

    .post-body {
      font-size: 1.15rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      background: transparent;
      padding: 4px 0;
      border: none;
      min-height: 60px;
    }

    .post-body p {
      margin-bottom: 0.6rem;
    }

    .error-message {
      display: none;
    }

    .footer-note {
      margin-top: 20px;
      text-align: right;
      font-size: 0.85rem;
      opacity: 0.3;
      border: none;
      padding-top: 12px;
      letter-spacing: 0.3px;
    }

    @media (max-width: 560px) {
      .terminal {
        padding: 16px 12px;
      }
      .prompt-line {
        font-size: 1rem;
      }
      #contentIdInput {
        width: 100px;
        font-size: 1.1rem;
      }
      .btn {
        font-size: 1rem;
        padding: 2px 6px;
      }
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
      background: #000;
    }
    ::-webkit-scrollbar-thumb {
      background: #9b59b6;
      border-radius: 0;
    }
    ::-webkit-scrollbar-track {
      background: #000;
    }
  </style>
</head>
<body>
<div class="terminal">

  <div class="input-area">
    <div class="prompt-line">
      <span class="prompt-symbol"></span>
      <span class="prompt-text"></span>
    </div>
    <div class="input-group">
      <label for="contentIdInput"></label>
      <input type="text" id="contentIdInput" placeholder="" value="" maxlength="20" spellcheck="false">
      <button class="btn" id="loadBtn"></button>
      <button class="btn" id="randomBtn"></button>
    </div>
  </div>

  <div class="content-display" id="contentDisplay">
  </div>

  <div class="footer-note"></div>
</div>

<script>
  (function() {
    // ----- 辅助函数：获取当前系统时间 -----
    function getNow() {
      return new Date();
    }

    // ----- 判断是否为8月11日 (月=7, 日=11, 因为getMonth()从0开始) -----
    function isAugust11(date) {
      return date.getMonth() === 7 && date.getDate() === 11;
    }

    // ----- 判断是否早于2008年8月11日 -----
    function isBefore20080811(date) {
      const target = new Date(2008, 7, 11); // 2008-08-11
      return date.getTime() < target.getTime();
    }

    // ----- 生成 20080811 的动态内容 -----
    function get20080811Content() {
      const now = getNow();
      
      // 早于 2008-08-11
      if (isBefore20080811(now)) {
        return '...';
      }
      
      // 是8月11日 (且年份 >= 2008)
      if (isAugust11(now)) {
        const year = now.getFullYear();
        const age = year - 2008;
        return `This is someone's ${age}th birthday.`;
      }
      
      // 不是8月11日，且 >= 2008-08-11
      return '...';
    }

    // ----- 博客数据 -----
    const posts = {
      '0': {
        id: '0',
        body: `The origin.\nSome say it's trivial; some say it's bizarre. In whichever way, we must proceed.`
      },
      '1': {
        id: '1',
        body: `This marks the beginning of calculations.`
      },
      '2': {
        id: '2',
        body: `This is the number of hands that a common human has.\nOnce we have moved from 1 to 2, it's quite easy to get other following results.`
      },
      '-1': {
        id: '-1',
        body: `The other way.`
      },
      'pi': {
        id: 'pi',
        body: `In a circle and its diameter, in series of integer powers, in elastic collisions, in trigonometry, ...\n... it's everywhere.`
      },
      '9': {
        id: '9',
        body: `Ludwig van Beethoven's Symphony No. 9 in D minor, Op. 125, is a choral symphony, the final complete symphony by Beethoven, composed between 1822 and 1824. It was first performed in Vienna on 7 May 1824. The symphony is regarded by many critics and musicologists as Beethoven's greatest work and one of the supreme achievements in the history of music. One of the best-known works in common practice music, it stands as one of the most frequently performed symphonies in the world. The symphony was the first example of a major composer using voices in a symphony. The text is adapted from Friedrich Schiller's poem "Ode to Joy".`
      },
      '18': {
        id: '18',
        body: `Shall I compare thee to a summer's day?\nThou art more lovely and more temperate:\nRough winds do shake the darling buds of May,\nAnd summer's lease hath all too short a date;\nSometime too hot the eye of heaven shines,\nAnd often is his gold complexion dimm'd;\nAnd every fair from fair sometime declines,\nBy chance or nature's changing course untrimm'd;\nBut thy eternal summer shall not fade,\nNor lose possession of that fair thou ow'st;\nNor shall death brag thou wander'st in his shade,\nWhen in eternal lines to time thou grow'st:\nSo long as men can breathe or eyes can see,\nSo long lives this, and this gives life to thee.`
      },
      'i': {
        id: 'i',
        body: `The ninth Latin alphabet.\n... I choose not to make this one a maths reference. Otherwise what about j and k?`
      },
      'I': {
        id: 'I',
        body: `Chances are you are an egotist.`
      },
      '666': {
        id: '666',
        body: `Please retry.`,
        isRed: true
      },
      '10': {
        id: '10',
        body: `We have reached the number of fingers that a common human has.\nHard to say whether good or not that is.`
      },
      'e': {
        id: 'e',
        body: `$$\\frac{1}{0!} + \\frac{1}{1!} + \\frac{1}{2!} + \\cdots$$\n$$\\approx$$\n$$2.7182818284590452353602874713526624977572470936999595749669676277240766303535475945713821785251664274$$`
      },
      '20150915': {
        id: '20150915',
        body: `... was when we witnessed the release of a really nice game.`
      },
      '20080811': {
        id: '20080811',
        body: get20080811Content(),  // 动态内容
        isDynamic: true
      },
      '19980829': {
        id: '19980829',
        body: '',  // 空内容，不显示文字
        isEmpty: true
      },
      '1225': {
        id: '1225',
        body: `Don't forget.`
      },
      'Klartsharr': {
        id: 'Klartsharr',
        body: `Oh, where did you get that name?`
      },
      'klartsharr': {
        id: 'klartsharr',
        body: `Spell it into a Name, would you?`
      },
      'KLARTSHARR': {
        id: 'KLARTSHARR',
        body: `STOP.`
      }
    };

    const displayEl = document.getElementById('contentDisplay');
    const inputEl = document.getElementById('contentIdInput');
    const loadBtn = document.getElementById('loadBtn');
    const randomBtn = document.getElementById('randomBtn');
    const titleEl = document.getElementById('pageTitle');

    // 保存当前加载的编号，用于刷新时重新计算（20080811动态内容）
    let currentId = '';

    function renderPost(post, id) {
      if (!post) return null;

      // 如果是 19980829，内容为空
      if (post.isEmpty) {
        return '';
      }

      // 如果是动态内容（20080811），重新获取最新内容
      let bodyText = post.body;
      if (post.isDynamic) {
        bodyText = get20080811Content();
      }

      let bodyHtml = bodyText
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>')
        .replace(/  /g, '&nbsp;&nbsp;');

      // 如果是 666，用红色 span 包裹
      if (post.isRed) {
        bodyHtml = `<span class="red-text">${bodyHtml}</span>`;
      }

      return `<div class="post-body">${bodyHtml}</div>`;
    }

    function clearDisplay() {
      displayEl.innerHTML = '';
    }

    function loadContentById(id) {
      const raw = String(id);
      if (raw === '') {
        inputEl.value = '';
        displayEl.innerHTML = '';
        titleEl.textContent = '';
        currentId = '';
        return;
      }

      const found = posts.hasOwnProperty(raw) ? posts[raw] : null;
      if (found) {
        currentId = raw;
        titleEl.textContent = raw;
        
        // 19980829 特殊处理：清空内容，标题改为19980829，输入框保留
        if (found.isEmpty) {
          displayEl.innerHTML = '';
          // 标题已经在上面设置了
          return;
        }

        const html = renderPost(found, raw);
        if (html !== null && html !== '') {
          displayEl.innerHTML = html;
          if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(function(err) {});
          }
        } else {
          displayEl.innerHTML = '';
        }
      } else {
        // 编号不存在：清除输入框 + 清除显示内容
        inputEl.value = '';
        displayEl.innerHTML = '';
        titleEl.textContent = '';
        currentId = '';
      }
    }

    // 用于刷新页面时重新计算动态内容（20080811）
    function refreshCurrentContent() {
      if (currentId && posts.hasOwnProperty(currentId)) {
        const post = posts[currentId];
        if (post.isDynamic) {
          // 重新渲染动态内容
          const html = renderPost(post, currentId);
          if (html !== null && html !== '') {
            displayEl.innerHTML = html;
            if (window.MathJax && MathJax.typesetPromise) {
              MathJax.typesetPromise().catch(function(err) {});
            }
          }
        }
      }
    }

    function loadRandom() {
      const keys = Object.keys(posts);
      if (keys.length === 0) {
        inputEl.value = '';
        displayEl.innerHTML = '';
        titleEl.textContent = '';
        currentId = '';
        return;
      }
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      inputEl.value = randomKey;
      loadContentById(randomKey);
    }

    function init() {
      displayEl.innerHTML = '';
      inputEl.value = '';
      titleEl.textContent = '';
      currentId = '';

      loadBtn.addEventListener('click', function(e) {
        const val = inputEl.value;
        const trimmed = val.trim();
        if (trimmed === '') {
          inputEl.value = '';
          displayEl.innerHTML = '';
          titleEl.textContent = '';
          currentId = '';
          return;
        }
        loadContentById(val);
      });

      randomBtn.addEventListener('click', function(e) {
        loadRandom();
      });

      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = inputEl.value;
          const trimmed = val.trim();
          if (trimmed === '') {
            inputEl.value = '';
            displayEl.innerHTML = '';
            titleEl.textContent = '';
            currentId = '';
            return;
          }
          loadContentById(val);
        }
      });

      inputEl.addEventListener('focus', function() {
        this.select();
      });

      // 页面可见性变化时刷新动态内容（如从后台切回）
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          refreshCurrentContent();
        }
      });

      // 每分钟刷新一次动态内容（应对跨分钟边界）
      setInterval(function() {
        refreshCurrentContent();
      }, 60000);
    }

    init();
  })();
</script>
</body>
</html>
