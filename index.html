  <style>

    }

      max-width: 820px;

    }

    }

    body.bg-white .terminal * {
      color: #000000 !important;
    }

    body.bg-white .MathJax {
      color: #000000 !important;
      fill: #000000 !important;
    }
    body.bg-white .MathJax_SVG * {
      color: #000000 !important;
      fill: #000000 !important;
    }
    body.bg-white .MathJax_SVG g path,
    body.bg-white .MathJax_SVG g rect,
    body.bg-white .MathJax_SVG g use {
      stroke: #000000 !important;
      fill: #000000 !important;
    }

    body.bg-white .MathJax_SVG mi,
    body.bg-white .MathJax_SVG mn,
    body.bg-white .MathJax_SVG mo {
      fill: #000000 !important;

    }
    body.bg-white .audio-btn {
      background: #000000 !important;

    }
    body.bg-white .audio-btn:hover {

    }
    body.bg-white .red-text {

    }

    }

      border: none;

      background: transparent;

    }

    .input-group {

      border: none;
      color: #9b59b6;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: normal;
      padding: 2px 8px;

      box-shadow: none;
      transition: opacity 0.1s, transform 0.05s;
      text-transform: none;
      letter-spacing: 0.3px;
      opacity: 0.7;
      border: none;
      outline: none;
      text-decoration: underline 1px dotted #9b59b6;
      text-underline-offset: 3px;
    }

    .btn:hover {
      opacity: 1;
      background: transparent;
      text-decoration: underline 1px solid #9b59b6;
      transform: none;
    }

    .btn:active {
      opacity: 0.5;
      transform: none;
    }

    .content-display {
      background: transparent;
      border: none;
      padding: 14px 0 10px 0;
      min-height: 160px;
      box-shadow: none;
      margin-top: 4px;
    }

    .post-body {
      font-size: 1.15rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      background: transparent;
      padding: 4px 0;
      border: none;
      min-height: 60px;
    }

    .post-body p {
      margin-bottom: 0.6rem;
    }

    .error-message {
      display: none;
    }

    .footer-note {
      margin-top: 20px;
      text-align: right;
      font-size: 0.85rem;
      opacity: 0.3;
      border: none;
      padding-top: 12px;
      letter-spacing: 0.3px;

    @media (max-width: 560px) {
      .terminal {
        padding: 16px 12px;

      .prompt-line {

        font-size: 1.1rem;
      }
      .btn {
        font-size: 1rem;
        padding: 2px 6px;
      }
      .audio-btn {
        width: 40px;
        height: 40px;
      }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
      background: #000;
    }
    ::-webkit-scrollbar-thumb {
      background: #9b59b6;
      border-radius: 0;
    }
    ::-webkit-scrollbar-track {
      background: #000;
    }
  </style>
</head>

<script>
  (function() {
    // ----- 辅助函数：获取当前系统时间 -----
    function getNow() {
      return new Date();
    }

    function isAugust11(date) {
      return date.getMonth() === 7 && date.getDate() === 11;
    }

    function isBefore20080811(date) {
      const target = new Date(2008, 7, 11);
      return date.getTime() < target.getTime();
    }

    function get20080811Content() {
      const now = getNow();
      if (isBefore20080811(now)) {
        return '...';
      }
      if (isAugust11(now)) {
        const year = now.getFullYear();
        const age = year - 2008;
        return `This is someone's ${age}th birthday.`;
      }
      return '...';
    }

    // ============================================================

    // 按钮效果暂停背景音乐的时间（毫秒）
    const EFFECT_PAUSE_DURATION = 5000; // 5秒

    // ----- 博客数据 -----
    const posts = {

      },

        id: 'pi',
        body: `In a circle and its diameter, in series of integer powers, in elastic collisions, in trigonometry, ...\n... it's everywhere.`
      },
      '9': {
        id: '9',
        body: `Ludwig van Beethoven's Symphony No. 9 in D minor, Op. 125, is a choral symphony, the final complete symphony by Beethoven, composed between 1822 and 1824. It was first performed in Vienna on 7 May 1824. The symphony is regarded by many critics and musicologists as Beethoven's greatest work and one of the supreme achievements in the history of music. One of the best-known works in common practice music, it stands as one of the most frequently performed symphonies in the world. The symphony was the first example of a major composer using voices in a symphony. The text is adapted from Friedrich Schiller's poem "Ode to Joy".`

        body: `... was when we witnessed the release of a really nice game.`
      },
      '20080811': {
        id: '20080811',
        body: get20080811Content(),
        isDynamic: true
      },

        isEmpty: true
      },

        id: '1225',

        body: `Spell it into a Name, would you?`
      },
      'KLARTSHARR': {
        id: 'KLARTSHARR',
        body: `STOP.`
      },
      '20260702': {
        id: '20260702',
        body: 'AUDIO_PLACEHOLDER',
        hasAudio: true,
        audioUrl: AUDIO_URL_20260702,
        audioTitle: 'Scarlet Forest',
        audioCredit: 'From DELTARUNE Chapter 1 by Toby Fox.'
      },
      '20260616': {
        id: '20260616',
        body: 'AUDIO_PLACEHOLDER',
        hasAudio: true,
        audioUrl: AUDIO_URL_20260616,
        audioTitle: 'Piano Concerto in A Major',
        audioCredit: `This concerto is dedicated to a most supportive friend of mine. Only with his calm, constant and heartfelt company could I conceive such peaceful melodies. Included in the Andante movement is a passage adapted from a very early prelude for piano solo of his, by which I first became acquainted with him during my last years of elementary school. Six years have passed since then, and I have graduated from high school. No word might possibly express the slightest of my gratitude for such a precious confidant, my dearest doctor of Mathematics who has always been with me in my teenage years.`
      },
      'testentry': {
        id: 'testentry',
        body: 'TEST_ENTRY_PLACEHOLDER',
        isTestEntry: true
      }
    };

    const displayEl = document.getElementById('contentDisplay');
    const inputEl = document.getElementById('contentIdInput');
    const loadBtn = document.getElementById('loadBtn');
    const randomBtn = document.getElementById('randomBtn');
    const titleEl = document.getElementById('pageTitle');
    const cloudContainer = document.getElementById('cloudContainer');
    const cloudImg = document.getElementById('cloudImg');

    let currentId = '';
    let currentAudio = null;
    let bgTimer = null;
    let isBgWhite = false;

    // testentry 背景音乐
    let bgmAudio = null;
    let isBgmPlaying = false;
    let bgmResumeTimer = null; // 恢复背景音乐的定时器

    // ----- 背景变白 -----
    function startBgTimer() {
      clearTimeout(bgTimer);
      bgTimer = setTimeout(function() {
        document.body.classList.add('bg-white');
        isBgWhite = true;
      }, 60000);
    }

    function resetBgTimer() {
      clearTimeout(bgTimer);
      if (isBgWhite) {
        document.body.classList.remove('bg-white');
        isBgWhite = false;
      }
      startBgTimer();
    }

    // ----- testentry 背景音乐控制 -----
    function startBgm() {
      clearTimeout(bgmResumeTimer);
      if (bgmAudio) {
        bgmAudio.pause();
        bgmAudio = null;
      }
      bgmAudio = new Audio(AUDIO_URL_TEST_BGM);
      bgmAudio.loop = true;
      bgmAudio.play().catch(function(err) {
        console.log('背景音乐播放失败:', err);
      });
      isBgmPlaying = true;
    }

    function pauseBgm() {
      clearTimeout(bgmResumeTimer);
      if (bgmAudio) {
        bgmAudio.pause();
        isBgmPlaying = false;
      }
    }

    function resumeBgm() {
      clearTimeout(bgmResumeTimer);
      if (bgmAudio && !isBgmPlaying) {
        bgmAudio.play().catch(function(err) {
          console.log('背景音乐恢复失败:', err);
        });
        isBgmPlaying = true;
      } else if (!bgmAudio) {
        startBgm();
      }
    }

    // 暂停背景音乐，并在指定时间后恢复
    function pauseBgmWithResume(delay) {
      pauseBgm();
      clearTimeout(bgmResumeTimer);
      bgmResumeTimer = setTimeout(function() {
        resumeBgm();
      }, delay);
    }

    function stopBgm() {
      clearTimeout(bgmResumeTimer);
      if (bgmAudio) {
        bgmAudio.pause();
        bgmAudio = null;
        isBgmPlaying = false;
      }
    }

    // ----- 渲染 post -----
    function renderPost(post, id) {
      if (!post) return null;

      if (post.isEmpty) {
        return '';
      }

      if (post.hasAudio) {
        return `<div class="post-body">
          <button id="playAudioBtn" class="audio-btn"></button>
          <div id="audioInfo" class="audio-info">
            <div class="audio-title">${post.audioTitle}</div>
            <div class="audio-credit">${post.audioCredit}</div>
          </div>
        </div>`;
      }

      if (post.isTestEntry) {
        return `<div class="post-body">
          <div>This is a test entry. Feel free to activate the button, and everything else...</div>
          <div class="black-text">... including this.</div>
          <div class="color-buttons">
            <button class="color-btn color-btn-red" data-color="red"></button>
            <button class="color-btn color-btn-yellow" data-color="yellow"></button>
            <button class="color-btn color-btn-blue" data-color="blue"></button>
          </div>
          <div id="testEntryResult"></div>
        </div>`;
      }

      let bodyText = post.body;
      if (post.isDynamic) {
        bodyText = get20080811Content();
      }

      let bodyHtml = bodyText
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>')
        .replace(/  /g, '&nbsp;&nbsp;');

      if (post.isRed) {
        bodyHtml = `<span class="red-text">${bodyHtml}</span>`;
      }

      return `<div class="post-body">${bodyHtml}</div>`;
    }

    // ----- 绑定音频按钮 -----
    function bindAudioButton(post) {
      if (!post || !post.hasAudio) return;
      
      const btn = document.getElementById('playAudioBtn');
      const infoEl = document.getElementById('audioInfo');
      
      if (btn) {
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        
        newBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          
          if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
            if (infoEl) {
              infoEl.classList.remove('playing');
            }
            return;
          }
          
          const audio = new Audio(post.audioUrl);
          currentAudio = audio;
          
          if (infoEl) {
            infoEl.classList.add('playing');
          }
          
          audio.play()
            .then(function() {
              audio.addEventListener('ended', function() {
                currentAudio = null;
                if (infoEl) {
                  infoEl.classList.remove('playing');
                }
              });
            })
            .catch(function(err) {
              console.log('音频播放失败:', err);
              currentAudio = null;
              if (infoEl) {
                infoEl.classList.remove('playing');
              }
            });
        });
      }
    }

    // ----- 绑定 testentry 按钮 -----
    function bindTestEntryButtons() {
      const redBtn = document.querySelector('.color-btn-red');
      const yellowBtn = document.querySelector('.color-btn-yellow');
      const blueBtn = document.querySelector('.color-btn-blue');
      const resultEl = document.getElementById('testEntryResult');

      // 红色文字元素引用
      let redTextElement = null;

      // 清除其他按钮效果（保留音效），并暂停背景音乐
      function clearOtherEffects(keepColor) {
        // 清除红色文字（但保留引用，由红色按钮自己控制）
        if (keepColor !== 'red') {
          const redText = resultEl.querySelector('.red-text-result');
          if (redText) {
            redText.remove();
            redTextElement = null;
          }
        }
        // 清除蓝色云朵
        if (keepColor !== 'blue') {
          cloudContainer.classList.remove('show');
        }
      }

      // 红色按钮 - 可再次点击切换显示/隐藏文字，同时重新播放背景音乐
      if (redBtn) {
        redBtn.addEventListener('click', function() {
          // 清除其他按钮效果（红色保留）
          clearOtherEffects('red');
          
          // 查找现有红色文字
          const existingRed = resultEl.querySelector('.red-text-result');
          
          if (existingRed) {
            // 如果已存在，移除文字，恢复背景音乐
            existingRed.remove();
            redTextElement = null;
            // 恢复背景音乐（立即恢复）
            resumeBgm();
          } else {
            // 不存在则创建文字
            const div = document.createElement('div');
            div.className = 'red-text red-text-result';
            div.textContent = 'My apologies to all of these.';
            resultEl.appendChild(div);
            redTextElement = div;
            // 暂停背景音乐5秒后恢复
            pauseBgmWithResume(EFFECT_PAUSE_DURATION);
          }
        });
      }

      // 鹅黄色按钮
      if (yellowBtn) {
        yellowBtn.addEventListener('click', function() {
          clearOtherEffects('yellow');
          // 播放音效
          const audio = new Audio(AUDIO_URL_YELLOW);
          audio.play().catch(function(err) {
            console.log('黄色音效播放失败:', err);
          });
          // 暂停背景音乐5秒后恢复
          pauseBgmWithResume(EFFECT_PAUSE_DURATION);
        });
      }

      // 天蓝色按钮
      if (blueBtn) {
        blueBtn.addEventListener('click', function() {
          clearOtherEffects('blue');
          // 设置云朵图片
          cloudImg.src = CLOUD_IMAGE_URL;
          cloudContainer.classList.add('show');
          // 暂停背景音乐5秒后恢复
          pauseBgmWithResume(EFFECT_PAUSE_DURATION);
          // 2s后淡出云朵（但不影响背景音乐恢复，音乐在5秒后恢复）
          setTimeout(function() {
            cloudContainer.classList.remove('show');
          }, 2000);
        });
      }
    }

    // ----- 加载内容 -----
    function loadContentById(id) {
      const raw = String(id);
      if (raw === '') {
        inputEl.value = '';
        displayEl.innerHTML = '';
        titleEl.textContent = '';
        currentId = '';
        stopBgm();
        resetBgTimer();
        return;
      }

      const found = posts.hasOwnProperty(raw) ? posts[raw] : null;
      if (found) {
        currentId = raw;
        titleEl.textContent = raw;
        resetBgTimer();

        stopBgm();

        if (found.isEmpty) {
          displayEl.innerHTML = '';
          return;
        }

        const html = renderPost(found, raw);
        if (html !== null && html !== '') {
          displayEl.innerHTML = html;
          
          if (found.hasAudio) {
            bindAudioButton(found);
          }

          if (found.isTestEntry) {
            startBgm();
            bindTestEntryButtons();
          }

          if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(function(err) {});
          }
        } else {
          displayEl.innerHTML = '';
        }
      } else {
        inputEl.value = '';
        displayEl.innerHTML = '';
        titleEl.textContent = '';
        currentId = '';
        stopBgm();
        resetBgTimer();
      }
    }

    // ----- 刷新动态内容 -----
    function refreshCurrentContent() {
      if (currentId && posts.hasOwnProperty(currentId)) {
        const post = posts[currentId];
        if (post.isDynamic) {
          const html = renderPost(post, currentId);
          if (html !== null && html !== '') {
            displayEl.innerHTML = html;
            if (window.MathJax && MathJax.typesetPromise) {
              MathJax.typesetPromise().catch(function(err) {});
            }
          }
        }
      }
    }

    // ----- 随机加载 -----
    function loadRandom() {
      const keys = Object.keys(posts);
      if (keys.length === 0) {
        inputEl.value = '';
        displayEl.innerHTML = '';
        titleEl.textContent = '';
        currentId = '';
        stopBgm();
        resetBgTimer();
        return;
      }
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      inputEl.value = randomKey;
      loadContentById(randomKey);
    }

    // ----- 初始化 -----
    function init() {
      displayEl.innerHTML = '';
      inputEl.value = '';
      titleEl.textContent = '';
      currentId = '';
      startBgTimer();

      loadBtn.addEventListener('click', function(e) {
        const val = inputEl.value;
        const trimmed = val.trim();
        if (trimmed === '') {
          inputEl.value = '';
          displayEl.innerHTML = '';
          titleEl.textContent = '';
          currentId = '';
          stopBgm();
          resetBgTimer();
          return;
        }
        loadContentById(val);
      });

      randomBtn.addEventListener('click', function(e) {
        loadRandom();
      });

      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = inputEl.value;
          const trimmed = val.trim();
          if (trimmed === '') {
            inputEl.value = '';
            displayEl.innerHTML = '';
            titleEl.textContent = '';
            currentId = '';
            stopBgm();
            resetBgTimer();
            return;
          }
          loadContentById(val);
        }
      });

      inputEl.addEventListener('focus', function() {
        this.select();
      });

      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          refreshCurrentContent();
        }
      });

      setInterval(function() {
        refreshCurrentContent();
      }, 60000);
    }

    init();
  })();
</script>
</body>
</html>
