    body {

      justify-content: center;
      align-items: center;

    .square-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .square-container.active {
      opacity: 1;
    }

    .square {
      position: absolute;
      background: #000000;
      opacity: 0;

      animation-delay: var(--delay, 0s);
      width: var(--size, 8px);
      height: var(--size, 8px);
    }

    @keyframes slideDiagonal {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.3);
      }
      10% {
        opacity: 0.85;
      }
      90% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.2);
      }
    }

    .terminal {
      max-width: 820px;
      width: 100%;
      background: #000000;
      padding: 24px 20px 28px;
      transition: background-color 2s ease;
      position: relative;
      z-index: 1;
    }

      font-weight: bold;

      background: #9b59b6;
      border-radius: 0;
    }
    ::-webkit-scrollbar-track {
      background: #000;
    }
  </style>

<script>

    // ============================================================
    // ★★★ 循环播放工具函数 ★★★
    // ============================================================
    function setupLoopPlayback(audioElement, loopEndOffset) {
      if (!audioElement) return;
      
      // 等待音频元数据加载完成
      audioElement.addEventListener('loadedmetadata', function() {
        const duration = audioElement.duration;
        if (duration > loopEndOffset) {
          const loopEnd = duration - loopEndOffset;
          audioElement.addEventListener('timeupdate', function onTimeUpdate() {
            if (audioElement.currentTime >= loopEnd) {
              audioElement.currentTime = 0;
              audioElement.play().catch(function(err) {
                console.log('循环播放跳转失败:', err);
              });
            }
          });
        }
      });
    }

    function createLoopedAudio(url, loopEndOffset) {
      const audio = new Audio(url);
      setupLoopPlayback(audio, loopEndOffset);
      return audio;
    }

    // ============================================================
    // ★★★ 初始横线显示/隐藏控制 ★★★
    // ============================================================
    function hideInitialInput() {
      initialInputArea.classList.add('hidden');
      initialInputArea.classList.remove('fade-in');
    }

    function showInitialInput() {
      initialInputArea.classList.remove('hidden');
      initialInputArea.classList.remove('fade-in');
      void initialInputArea.offsetWidth;
      initialInputArea.classList.add('fade-in');
    }

    // ============================================================
    // ★★★ 音频停止函数 ★★★
    // ============================================================
    function stopAllAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
        const infoEl = document.getElementById('audioInfo');
        if (infoEl) infoEl.classList.remove('playing');
      }
      if (bgmAudio) {
        bgmAudio.pause();
        bgmAudio = null;
        isBgmPlaying = false;
        isBgmPausedForEffect = false;
      }
      clearTimeout(bgmResumeTimer);
      bgmResumeTimer = null;
      if (answerAudio) {
        answerAudio.pause();
        answerAudio = null;
      }
      clearTimeout(answerTimeout);
      answerTimeout = null;
    }

    // ----- 黑色小方块 -----
    function addSquareBatch() {
      if (!isSquareRunning) return;
      const container = squareContainer;
      const count = 15 + Math.floor(Math.random() * 15);
      for (let i = 0; i < count; i++) {
        const square = document.createElement('div');
        square.className = 'square';
        const startX = Math.random() * 90;
        const startY = Math.random() * 90;
        square.style.left = startX + '%';
        square.style.top = startY + '%';
        const targetX = (100 - startX) * 0.8 + 10;
        const targetY = (100 - startY) * 0.8 + 10;
        square.style.setProperty('--tx', targetX + 'vw');
        square.style.setProperty('--ty', targetY + 'vh');
        square.style.setProperty('--delay', (Math.random() * 0.8) + 's');
        const size = 4 + Math.random() * 10;
        square.style.setProperty('--size', size + 'px');
        square.style.setProperty('--duration', (3 + Math.random() * 3) + 's');
        container.appendChild(square);
      }
    }

    function startSquares() {
      if (isSquareRunning) return;
      isSquareRunning = true;
      squareContainer.innerHTML = '';
      squareContainer.classList.add('active');
      addSquareBatch();
      squareInterval = setInterval(function() {
        if (isSquareRunning) addSquareBatch();
      }, 1500);
    }

    function stopSquares() {
      isSquareRunning = false;
      if (squareInterval) {
        clearInterval(squareInterval);
        squareInterval = null;
      }
      squareContainer.classList.remove('active');
      setTimeout(function() {
        if (!isSquareRunning) squareContainer.innerHTML = '';
      }, 8000);
    }

    // ----- 背景变白 -----
    function startBgTimer() {
      clearTimeout(bgTimer);
      bgTimer = setTimeout(function() {
        if (currentId === 'testentry') {
          document.body.classList.add('bg-white');
          isBgWhite = true;
          startSquares();
        }
      }, 60000);
    }

    function resetBgTimer() {
      clearTimeout(bgTimer);
      if (isBgWhite) {
        document.body.classList.remove('bg-white');
        isBgWhite = false;
        stopSquares();
      }
      if (currentId === 'testentry') startBgTimer();
    }

    // ----- testentry 背景音乐控制（带循环） -----
    function startBgm() {
      clearTimeout(bgmResumeTimer);
      if (bgmAudio) { 
        bgmAudio.pause(); 
        bgmAudio = null; 
      }
      bgmAudio = createLoopedAudio(AUDIO_URL_TEST_BGM, LOOP_END_OFFSET);
      bgmAudio.loop = false; // 使用自定义循环
      bgmAudio.play().catch(function(err) { 
        console.log('背景音乐播放失败:', err); 
      });
      isBgmPlaying = true;
      isBgmPausedForEffect = false;
    }

    function pauseBgmForEffect() {
      if (!bgmAudio || !isBgmPlaying) return;
      clearTimeout(bgmResumeTimer);
      bgmAudio.pause();
      isBgmPlaying = false;
      isBgmPausedForEffect = true;
    }

    function resumeBgmAfterEffect() {
      clearTimeout(bgmResumeTimer);
      if (bgmAudio && !isBgmPlaying && isBgmPausedForEffect) {
        bgmAudio.play().catch(function(err) {
          console.log('背景音乐恢复失败:', err);
        });
        isBgmPlaying = true;
        isBgmPausedForEffect = false;
      } else if (!bgmAudio) { 
        startBgm(); 
      }
    }

    function handleButtonEffect() {
      pauseBgmForEffect();
      clearTimeout(bgmResumeTimer);
      bgmResumeTimer = setTimeout(function() { resumeBgmAfterEffect(); }, EFFECT_PAUSE_DURATION);
    }

    // ============================================================
    // ★★★ 20260703 答案验证逻辑 ★★★
    // ============================================================
    const CORRECT_ANSWERS = ['\\dfrac{288}{125}', '288/125', '2.304'];
    const WRONG_ANSWERS = ['24/7', '25/7', '24/25', '4/3', '5/3', '5/4', '1', '1.25', '1.5', '3/2', '5/2', '2', '2.5', '3', '4'];

    function checkAnswer(inputVal) {
      const trimmed = inputVal.trim();
      if (trimmed === '') return;
      
      if (CORRECT_ANSWERS.includes(trimmed)) {
        triggerCorrectAnswer();
        return;
      }
      
      if (WRONG_ANSWERS.includes(trimmed)) {
        triggerWrongAnswer();
        return;
      }
      
      resetToInitialState();
    }

    function resetToInitialState() {
      if (answerAudio) {
        answerAudio.pause();
        answerAudio = null;
      }
      clearTimeout(answerTimeout);
      answerTimeout = null;
      
      displayEl.innerHTML = '';
      showInitialInput();
      
      if (isBgWhite) {
        document.body.classList.remove('bg-white');
        isBgWhite = false;
        stopSquares();
      }
      
      isAnswerEffectActive = false;
    }

    function triggerCorrectAnswer() {
      clearAnswerEffects();
      
      isAnswerEffectActive = true;
      
      // 使用循环播放的音频
      answerAudio = createLoopedAudio(AUDIO_URL_20260703_CORRECT, LOOP_END_OFFSET);
      answerAudio.play().catch(function(err) { 
        console.log('正确答案音乐播放失败:', err); 
      });
      
      document.body.classList.add('bg-white');
      isBgWhite = true;
      startSquares();
      
      const answerArea = document.querySelector('.answer-input-area');
      if (answerArea) {
        answerArea.classList.add('hidden');
      }
      
      const displayDiv = document.getElementById('answerDisplay');
      if (displayDiv) {
        displayDiv.innerHTML = '$$\\dfrac{288}{125}$$';
        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetPromise().catch(function(err) {});
        }
      }
      
      const resultDiv = document.getElementById('answerResult');
      if (resultDiv) {
        resultDiv.innerHTML = '<div class="correct-answer-text">THAT\'S RIGHT! A REALLY BAD-LOOKING ANSWER!!!</div>';
      }
      
      clearTimeout(answerTimeout);
      answerTimeout = setTimeout(function() {
        if (currentId === '20260703') {
          showInitialInput();
        }
      }, 5000);
    }

    function triggerWrongAnswer() {
      clearAnswerEffects();
      
      isAnswerEffectActive = true;
      
      answerAudio = new Audio(AUDIO_URL_20260703_WRONG);
      answerAudio.play().catch(function(err) { console.log('错误答案音效播放失败:', err); });
      
      const answerArea = document.querySelector('.answer-input-area');
      if (answerArea) {
        answerArea.classList.add('hidden');
      }
      
      const resultDiv = document.getElementById('answerResult');
      if (resultDiv) {
        resultDiv.innerHTML = '<div class="wrong-answer-text">So that\'s all you could imagine???</div>';
      }
      
      clearTimeout(answerTimeout);
      answerTimeout = setTimeout(function() {
        if (currentId === '20260703') {
          showInitialInput();
        }
      }, 5000);
    }

    function clearAnswerEffects() {
      if (answerAudio) {
        answerAudio.pause();
        answerAudio = null;
      }
      clearTimeout(answerTimeout);
      answerTimeout = null;
      
      const resultDiv = document.getElementById('answerResult');
      if (resultDiv) resultDiv.innerHTML = '';
      
      isAnswerEffectActive = false;
    }

    // ----- 渲染 -----
    function renderPost(post, id) {
      if (!post) return null;
      if (post.isEmpty) return '';
      if (post.hasAudio) {
        return `<div class="post-body">
          <button id="playAudioBtn" class="audio-btn"></button>
          <div id="audioInfo" class="audio-info">
            <div class="audio-title">${post.audioTitle}</div>
            <div class="audio-credit">${post.audioCredit}</div>
          </div>
        </div>`;
      }
      if (post.isTestEntry) {
        return `<div class="post-body">
          <div>This is a test entry. Feel free to activate the buttons, and everything else...</div>
          <div class="black-text">... including this.</div>
          <div class="color-buttons">
            <button class="color-btn color-btn-red" data-color="red"></button>
            <button class="color-btn color-btn-yellow" data-color="yellow"></button>
            <button class="color-btn color-btn-blue" data-color="blue"></button>
          </div>
          <div id="testEntryResult"></div>
        </div>`;
      }
      if (post.isAnswerEntry) {
        hideInitialInput();
        return `<div class="post-body">
          <div>Let $PS$, $PT$ be two lines tangent to parabola $y^{2}=2px$ at two distinct points $S$ and $T$ which intersect at point $P$. Given that $\\left|PS\\right|=3$, $\\left|PT\\right|=4$, $\\left|ST\\right|=5$, we can calculate that $\\left|p\\right|=$</div>
          <div id="answerDisplay"></div>
          <div id="answerResult"></div>
          <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="" maxlength="30" spellcheck="false">
          </div>
        </div>`;
      }
      let bodyText = post.isDynamic ? get20080811Content() : post.body;
      let bodyHtml = bodyText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>').replace(/  /g, '&nbsp;&nbsp;');
      if (post.isRed) bodyHtml = `<span class="red-text">${bodyHtml}</span>`;
      return `<div class="post-body">${bodyHtml}</div>`;
    }

    function bindAudioButton(post) {
      if (!post || !post.hasAudio) return;
      const btn = document.getElementById('playAudioBtn');
      const infoEl = document.getElementById('audioInfo');
      if (btn) {
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        newBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
            if (infoEl) infoEl.classList.remove('playing');
            return;
          }
          const audio = new Audio(post.audioUrl);
          currentAudio = audio;
          if (infoEl) infoEl.classList.add('playing');
          audio.play().then(function() {
            audio.addEventListener('ended', function() {
              currentAudio = null;
              if (infoEl) infoEl.classList.remove('playing');
            });
          }).catch(function(err) {
            console.log('音频播放失败:', err);
            currentAudio = null;
            if (infoEl) infoEl.classList.remove('playing');
          });
        });
      }
    }

    function bindAnswerEntry() {
      const inputField = document.getElementById('answerInput');
      if (!inputField) return;
      
      function handleSubmit() {
        const val = inputField.value;
        checkAnswer(val);
      }
      
      inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSubmit();
        }
      });
      
      inputField.addEventListener('focus', function() { this.select(); });
    }

    function bindTestEntryButtons() {
      const redBtn = document.querySelector('.color-btn-red');
      const yellowBtn = document.querySelector('.color-btn-yellow');
      const blueBtn = document.querySelector('.color-btn-blue');
      const resultEl = document.getElementById('testEntryResult');
      let redTextElement = null;

      function clearOtherEffects(keepColor) {
        if (keepColor !== 'red') {
          const redText = resultEl.querySelector('.red-text-result');
          if (redText) { redText.remove(); redTextElement = null; }
        }
        if (keepColor !== 'blue') cloudContainer.classList.remove('show');
      }

      if (redBtn) {
        redBtn.addEventListener('click', function() {
          clearOtherEffects('red');
          const existingRed = resultEl.querySelector('.red-text-result');
          if (existingRed) {
            existingRed.remove();
            redTextElement = null;
            clearTimeout(bgmResumeTimer);
            resumeBgmAfterEffect();
          } else {
            const div = document.createElement('div');
            div.className = 'red-text red-text-result';
            div.textContent = 'My apologies to all of these.';
            resultEl.appendChild(div);
            redTextElement = div;
            handleButtonEffect();
          }
        });
      }
      if (yellowBtn) {
        yellowBtn.addEventListener('click', function() {
          clearOtherEffects('yellow');
          const audio = new Audio(AUDIO_URL_YELLOW);
          audio.play().catch(function(err) { console.log('黄色音效播放失败:', err); });
          handleButtonEffect();
        });
      }
      if (blueBtn) {
        blueBtn.addEventListener('click', function() {
          clearOtherEffects('blue');
          cloudImg.src = CLOUD_IMAGE_URL;
          cloudContainer.classList.add('show');
          handleButtonEffect();
          setTimeout(function() { cloudContainer.classList.remove('show'); }, 2000);
        });
      }
    }

    // ----- 加载内容 -----
    function loadContentById(id) {
      const raw = String(id);
      if (raw === '') {
        inputEl.value = ''; displayEl.innerHTML = ''; titleEl.textContent = ''; 
        stopAllAudio();
        clearTimeout(bgTimer);
        if (isBgWhite) {
          document.body.classList.remove('bg-white');
          isBgWhite = false;
          stopSquares();
        }
        currentId = '';
        showInitialInput();
        return;
      }
      const found = posts.hasOwnProperty(raw) ? posts[raw] : null;
      if (found) {
        stopAllAudio();
        
        if (currentId === '20260703') {
          clearAnswerEffects();
          if (isBgWhite) {
            document.body.classList.remove('bg-white');
            isBgWhite = false;
            stopSquares();
          }
        }
        
        currentId = raw;
        titleEl.textContent = raw;
        
        clearTimeout(bgTimer);
        if (isBgWhite) {
          document.body.classList.remove('bg-white');
          isBgWhite = false;
          stopSquares();
        }
        if (found.isTestEntry) {
          startBgTimer();
        }
        
        if (found.isEmpty) { 
          displayEl.innerHTML = '';
          showInitialInput();
          return; 
        }
        
        const html = renderPost(found, raw);
        if (html !== null && html !== '') {
          displayEl.innerHTML = html;
          if (found.hasAudio) bindAudioButton(found);
          if (found.isTestEntry) {
            startBgm();
            bindTestEntryButtons();
            if (isBgWhite) startSquares();
          }
          if (found.isAnswerEntry) {
            bindAnswerEntry();
          }
          if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(function(err) {});
          }
        } else { 
          displayEl.innerHTML = '';
          showInitialInput();
        }
      } else {
        inputEl.value = ''; displayEl.innerHTML = ''; titleEl.textContent = ''; 
        stopAllAudio();
        clearTimeout(bgTimer);
        if (isBgWhite) {
          document.body.classList.remove('bg-white');
          isBgWhite = false;
          stopSquares();
        }
        currentId = '';
        showInitialInput();
      }
    }

    function refreshCurrentContent() {
      if (currentId && posts.hasOwnProperty(currentId)) {
        const post = posts[currentId];
        if (post.isDynamic) {
          const html = renderPost(post, currentId);
          if (html !== null && html !== '') {
            displayEl.innerHTML = html;
            if (window.MathJax && MathJax.typesetPromise) {
              MathJax.typesetPromise().catch(function(err) {});
            }
          }
        }
      }
    }

    function loadRandom() {
      const keys = Object.keys(posts);
      if (keys.length === 0) {
        inputEl.value = ''; displayEl.innerHTML = ''; titleEl.textContent = ''; 
        stopAllAudio();
        clearTimeout(bgTimer);
        if (isBgWhite) {
          document.body.classList.remove('bg-white');
          isBgWhite = false;
          stopSquares();
        }
        currentId = '';
        showInitialInput();
        return;
      }
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      inputEl.value = randomKey;
      loadContentById(randomKey);
    }

    function init() {
      displayEl.innerHTML = '';
      inputEl.value = '';
      titleEl.textContent = '';
      currentId = '';
      showInitialInput();

      loadBtn.addEventListener('click', function(e) {
        const val = inputEl.value;
        const trimmed = val.trim();
        if (trimmed === '') {
          inputEl.value = ''; displayEl.innerHTML = ''; titleEl.textContent = ''; 
          stopAllAudio();
          clearTimeout(bgTimer);
          if (isBgWhite) {
            document.body.classList.remove('bg-white');
            isBgWhite = false;
            stopSquares();
          }
          currentId = '';
          showInitialInput();
          return;
        }
        loadContentById(val);
      });

      randomBtn.addEventListener('click', function(e) { loadRandom(); });

      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = inputEl.value;
          const trimmed = val.trim();
          if (trimmed === '') {
            inputEl.value = ''; displayEl.innerHTML = ''; titleEl.textContent = ''; 
            stopAllAudio();
            clearTimeout(bgTimer);
            if (isBgWhite) {
              document.body.classList.remove('bg-white');
              isBgWhite = false;
              stopSquares();
            }
            currentId = '';
            showInitialInput();
            return;
          }
          loadContentById(val);
        }
      });

      inputEl.addEventListener('focus', function() { this.select(); });

      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) refreshCurrentContent();
      });

      setInterval(function() { refreshCurrentContent(); }, 60000);
    }

    init();
  })();
</script>
